<!-- ============================================================
     REUSABLE PRODUCT CARD COMPONENTS — Lustra Fine Jewellery
     File:      components/product-card.html
     Purpose:   Premium specification blueprints for all 9 product card 
                variants. Used as a structural baseline across pages.
     Spec Ref:  04_Component_Library (§4), 07_Design_Tokens (§3-5),
                11_Accessibility_Guidelines, 18_Icon_Guidelines
     ============================================================ -->

<!-- ==========================================
     1. DEFAULT PRODUCT CARD VARIANT
     ========================================== -->
<article
  class="c-product-card"
  data-product-id="lst-001"
  data-variant="default"
  role="article"
  aria-roledescription="product card"
  aria-label="Aura Solitaire Ring in 18K Yellow Gold"
>
  <header class="c-product-card__header">
    <div class="c-product-card__badges" role="group" aria-label="Product tags">
      <span class="c-badge c-badge--new">New</span>
      <span class="c-badge c-badge--best-seller">Best Seller</span>
    </div>
    <button
      class="c-product-card__wishlist-btn"
      id="wishlist-btn-lst-001"
      aria-label="Add Aura Solitaire Ring to wishlist"
      aria-pressed="false"
      type="button"
    >
      <svg class="c-product-card__wishlist-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
      </svg>
      <span class="c-product-card__wishlist-spinner" aria-hidden="true"></span>
    </button>
  </header>

  <div class="c-product-card__media">
    <a href="product.html?id=lst-001" class="c-product-card__image-link" tabindex="-1" aria-hidden="true">
      <div class="c-product-card__image-wrap">
        <img
          src="assets/images/product-1-front.jpg"
          alt="Aura Solitaire Ring - Front view showcasing diamond cut"
          class="c-product-card__img c-product-card__img--front"
          loading="lazy"
          width="300"
          height="400"
        >
        <img
          src="assets/images/product-1-back.jpg"
          alt="Aura Solitaire Ring - Back side view illustrating hallmark detailing"
          class="c-product-card__img c-product-card__img--back"
          loading="lazy"
          width="300"
          height="400"
        >
      </div>
    </a>

    <div class="c-product-card__quick-actions">
      <button class="c-product-card__quick-action-btn" aria-label="Quick View Aura Solitaire Ring" data-action="quickview" type="button">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Quick View</span>
      </button>
      <button class="c-product-card__quick-action-btn" aria-label="Compare Aura Solitaire Ring" data-action="compare" type="button">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M4 4l17 17"/>
        </svg>
        <span>Compare</span>
      </button>
    </div>
  </div>

  <div class="c-product-card__details">
    <div class="c-product-card__collection">Aura Collection</div>
    <h3 class="c-product-card__title">
      <a href="product.html?id=lst-001" class="c-product-card__title-link">Aura Solitaire Ring</a>
    </h3>
    <p class="c-product-card__subtitle">A timeless expression of handmade luxury and elegance.</p>
    
    <div class="c-product-card__specs">
      <span class="c-product-card__spec-item">18K Yellow Gold</span>
      <span class="c-product-card__spec-divider" aria-hidden="true">•</span>
      <span class="c-product-card__spec-item">0.75ct Round Cut Diamond</span>
    </div>

    <div class="c-product-card__rating" aria-label="Rating: 4.9 stars out of 42 reviews">
      <div class="c-product-card__stars" aria-hidden="true">
        <svg class="c-product-card__star-icon is-filled" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="c-product-card__star-icon is-filled" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="c-product-card__star-icon is-filled" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="c-product-card__star-icon is-filled" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <svg class="c-product-card__star-icon is-filled" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </div>
      <span class="c-product-card__rating-text" aria-hidden="true">(42)</span>
    </div>

    <div class="c-product-card__price-group">
      <span class="c-product-card__price c-product-card__price--current">₹1,45,000</span>
      <span class="c-product-card__price c-product-card__price--original">₹1,75,000</span>
      <span class="c-product-card__discount" aria-label="17 percent discount">17% OFF</span>
    </div>
    
    <div class="c-product-card__emi">EMI available from ₹12,083/month</div>
  </div>

  <footer class="c-product-card__footer">
    <button class="btn btn--primary c-product-card__cta" id="add-to-box-lst-001" type="button">
      <span class="c-product-card__cta-text">Add to Jewellery Box</span>
      <span class="c-product-card__cta-spinner" aria-hidden="true"></span>
    </button>
  </footer>
</article>
