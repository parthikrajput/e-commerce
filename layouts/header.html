    <!-- Navigation directory links (Center column) -->
    <nav class="c-header__center c-nav" role="navigation" aria-label="Main Navigation Menu">
      <ul class="c-nav__list">
        <li class="c-nav__item">
          <a href="index.html" class="c-nav__link">Home</a>
        </li>
        <li class="c-nav__item c-nav__item--has-dropdown">
          <button class="c-nav__link c-nav__trigger" aria-expanded="false" aria-controls="shop-mega-menu">Shop</button>
        </li>
        <li class="c-nav__item c-nav__item--has-dropdown">
          <button class="c-nav__link c-nav__trigger" aria-expanded="false" aria-controls="collections-mega-menu">Collections</button>

        <li class="c-nav__item c-nav__item--has-dropdown">

        <li class="c-nav__item">

        <li class="c-nav__item">
          <a href="faq.html" class="c-nav__link">Support</a>
        </li>
      </ul>

    <!-- Header Actions (Right column) -->
    <div class="c-header__right c-actions">
      <!-- Search Input Toggle -->
      <button class="c-actions__btn c-actions__search-trigger" id="search-trigger" aria-label="Open Search Interface" aria-expanded="false">
        <svg class="c-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"/></svg>
      </button>

      <!-- User Account Gateway -->
      <a href="profile.html" class="c-actions__btn" aria-label="My Account">
        <svg class="c-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>

      <!-- Wishlist Panel Hook -->
      <button class="c-actions__btn c-actions__wishlist-trigger" id="wishlist-trigger" aria-label="Open Wishlist Drawer" aria-haspopup="dialog" aria-expanded="false">

      <button class="c-actions__btn c-actions__menu-trigger" id="menu-trigger" aria-label="Toggle Mobile Navigation Menu" aria-expanded="false" aria-controls="mobile-menu-drawer">
        <span class="c-actions__hamburger-box">
